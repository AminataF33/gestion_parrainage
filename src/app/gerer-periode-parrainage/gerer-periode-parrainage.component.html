<div class="dates-container">
    <h2>Gestion des dates de parrainage</h2>
    
    <div class="dates-form">
      <div class="date-field">
        <label for="startDate">Date d'ouverture:</label>
        <input 
          type="datetime-local" 
          id="startDate"
          [(ngModel)]="startDate"
          (change)="validateDates()"
          class="date-input">
      </div>

      <div class="date-field">
        <label for="endDate">Date de fermeture:</label>
        <input 
          type="datetime-local" 
          id="endDate"
          [(ngModel)]="endDate"
          (change)="validateDates()"
          class="date-input">
      </div>

      <button 
        (click)="onSubmit()"
        [disabled]="!isValid || !startDate || !endDate"
        class="submit-button">
        Valider les dates
      </button>

      <div *ngIf="message" [class]="messageClass">
        {{ message }}
      </div>
    </div>
  </div>
